<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Colaboradores · Propiedades</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Montserrat:wght@500;700;800&display=swap">
<style>
/* Concepto: portal de trabajo para corredores. Barra superior con rol, pestañas por permiso, vistas densas tipo catálogo/tablero. Azul marino como acento, dorado solo para niveles y premios. */
:root{
  --bg:#f2f5f2; --panel:#ffffff; --ink:#14201c; --mute:#58695f; --line:#dce3dd; --soft:#e6ebf7;
  --brand:#0a1f5c; --brand-ink:#ffffff; --gold:#b8860b; --gold-soft:#f8ebcf;
  --ok:#17824f; --warn:#c98a0c; --crit:#c63b3b; --info:#2a6cc0; --shade:rgba(20,32,28,.45); --nav:#061236; --nav-fg:#e9edff; --nav-mute:#9aa6cf; --sh:0 1px 2px rgba(20,32,28,.06),0 8px 24px -16px rgba(20,32,28,.25); --sh2:0 2px 6px rgba(20,32,28,.08),0 18px 40px -18px rgba(20,32,28,.35);
  --f-d:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-b:"Figtree","Segoe UI",system-ui,sans-serif; --f-m:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1513;--panel:#18211e;--ink:#e8efea;--mute:#9fb0a7;--line:#2c3a35;--soft:#15245c;--brand:#6f8fe8;--brand-ink:#05102e;--gold:#e5b24d;--gold-soft:#3a2f14;--ok:#4cc58b;--warn:#e2ad3a;--crit:#ef6b6b;--info:#6aa3ea;--shade:rgba(0,0,0,.6);--nav:#040b22;--nav-fg:#e9edff;--nav-mute:#8e9bc9;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.6);--sh2:0 2px 6px rgba(0,0,0,.35),0 18px 40px -18px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1513;--panel:#18211e;--ink:#e8efea;--mute:#9fb0a7;--line:#2c3a35;--soft:#15245c;--brand:#6f8fe8;--brand-ink:#05102e;--gold:#e5b24d;--gold-soft:#3a2f14;--ok:#4cc58b;--warn:#e2ad3a;--crit:#ef6b6b;--info:#6aa3ea;--shade:rgba(0,0,0,.6);--nav:#040b22;--nav-fg:#e9edff;--nav-mute:#8e9bc9;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.6);--sh2:0 2px 6px rgba(0,0,0,.35),0 18px 40px -18px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-b);padding-inline:0;padding-block:0 48px;-webkit-font-smoothing:antialiased}
.wrap{padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.15;text-wrap:balance}
.wrap{max-width:1180px;margin-inline:auto}
.topband{background:var(--nav);color:var(--nav-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 10px 30px -18px rgba(0,0,0,.6)}
.mono{font-family:var(--f-m)}
.top{padding-block:12px 0}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.logo{width:40px;height:40px;flex:none}.logo svg{width:100%;height:100%;display:block}
.brand b{font:700 17px var(--f-d);letter-spacing:-.01em;color:var(--nav-fg)}.brand small{display:block;color:var(--nav-mute);font-size:12px;margin-top:-2px}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who select{padding:6px 8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--nav-fg);border-radius:8px;max-width:210px}.who .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:var(--nav-fg)}.who .pill{background:rgba(255,255,255,.14);color:#fff}.who .pill.gold{background:linear-gradient(135deg,#f0c75e,#b8860b);color:#2a1d04}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--brand);white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:var(--gold)}.pill.red{background:color-mix(in srgb,var(--crit) 14%,var(--panel));color:var(--crit)}.pill.grey{background:var(--line);color:var(--mute)}.pill.blue{background:color-mix(in srgb,var(--info) 14%,var(--panel));color:var(--info)}.pill.amber{background:color-mix(in srgb,var(--warn) 16%,var(--panel));color:var(--warn)}
nav{display:flex;flex-wrap:wrap;gap:2px 2px;margin-top:10px}
@media (max-width:760px){nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}nav::-webkit-scrollbar{display:none}}
nav button{border:0;background:none;padding:10px 13px;border-bottom:3px solid transparent;color:var(--nav-mute);font-weight:600;white-space:nowrap;cursor:pointer;border-radius:6px 6px 0 0;transition:color .15s}
nav button:hover{color:#fff}nav button[aria-selected=true]{color:#fff;border-bottom-color:#f0c75e}
nav .pill.red{background:#e5484d;color:#fff}
main{padding-block:18px}
.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.head h2{font-size:26px;letter-spacing:-.015em}.eyebrow{font:600 11px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:4px;display:block}.head p{margin:2px 0 0;color:var(--mute);max-width:70ch}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand)}.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn{transition:transform .12s,box-shadow .12s,border-color .12s}.btn:active{transform:translateY(1px)}.btn.p{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:0 6px 14px -8px var(--brand)}.btn.p:hover{filter:brightness(1.08)}
.btn.s{padding:4px 9px;font-size:12px}.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}.btn.d{color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input,select,textarea{padding:7px 9px;border:1px solid var(--line);background:var(--panel);border-radius:8px;min-width:0;max-width:100%}
label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.muted{color:var(--mute)}.sm{font-size:12px}
.ph{position:relative;aspect-ratio:16/10;border-radius:10px 10px 0 0;overflow:hidden;display:flex;align-items:flex-end;padding:8px;color:#fff}
.ph::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 35%,rgba(0,0,0,.55))}
.ph>*{position:relative}.ph .tag{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap}
.ph em{font:500 10px var(--f-m);letter-spacing:.08em;opacity:.85;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.card{transition:transform .18s,box-shadow .18s;box-shadow:var(--sh)}.card:hover{border-color:var(--brand);transform:translateY(-3px);box-shadow:var(--sh2)}.card .b{padding:12px;display:grid;gap:5px}
.price{font:700 20px var(--f-d)}.price s{font:500 13px var(--f-b);color:var(--mute);margin-left:6px}.price .off{color:var(--ok);font:600 12px var(--f-b);margin-left:6px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-m);white-space:nowrap}
.hot{display:grid;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px;box-shadow:var(--sh)}.kpi b{font:700 26px/1.1 var(--f-d);font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--mute)}.kpi i{font-style:normal;font-size:11px;color:var(--ok);font-weight:600}
.hero{box-shadow:var(--sh2);border-radius:18px;overflow:hidden;position:relative;margin-bottom:14px;min-height:300px;display:flex;align-items:flex-end;color:#fff}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.05) 20%,rgba(10,20,16,.82))}
.hero .gsl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s ease}.hero .gsl.on{opacity:1}
.hstack{position:relative;z-index:2;display:grid;width:100%}.hstack>.hero-in{grid-area:1/1;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s}.hstack>.hero-in.on{opacity:1;visibility:visible}
.hdots{position:absolute;right:18px;bottom:16px;z-index:3;display:flex;gap:7px}.hdots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.45);cursor:pointer}.hdots button.on{background:#f0c45c;width:26px;border-radius:6px}
.hero .gcap{position:absolute;right:14px;top:14px;z-index:2;background:rgba(6,18,54,.72);color:#fff;font-size:12px;padding:5px 10px;border-radius:999px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-in{position:relative;z-index:2;padding:28px;display:grid;gap:8px;max-width:680px}.hero-in h2{font-size:34px;color:#fff}.hero-in p{margin:0;color:rgba(255,255,255,.85)}
.hr{display:grid;grid-template-columns:34px 78px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);transition:box-shadow .18s,border-color .18s}.hr:hover{box-shadow:var(--sh2);border-color:var(--brand)}
.hr .rk{font:700 22px var(--f-d);color:var(--brand);text-align:center}.hr:nth-child(-n+3) .rk{color:var(--gold)}
.hr .th{height:52px;border-radius:8px;background-size:cover!important}.hr .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.meter{height:6px;border-radius:9px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--brand)}
.kan{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:color-mix(in srgb,var(--line) 45%,var(--bg));border-radius:12px;padding:10px;min-height:200px;display:grid;align-content:start;gap:8px}
.col h3{font-size:13px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.lead{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:5px}
.lead.late{border-color:var(--crit)}
.lv{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.rk-hero{border-radius:16px;padding:24px;color:#fff;position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;background:linear-gradient(120deg,var(--lc) 0%,color-mix(in srgb,var(--lc) 55%,#111) 100%)}
.rk-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.rk-hero h2{color:#fff;font-size:30px}.rk-hero .big{font:700 48px/1 var(--f-d)}.rk-hero p{margin:0;color:rgba(255,255,255,.85)}
.ring.l{width:124px;height:124px;background:conic-gradient(#fff var(--p),rgba(255,255,255,.22) 0)}.ring.l div{width:100px;height:100px;background:rgba(0,0,0,.28);color:#fff;font-size:26px;backdrop-filter:blur(2px)}.ring.l small{color:rgba(255,255,255,.8)}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.step .prz{border-radius:10px;padding:10px;background:color-mix(in srgb,var(--c) 13%,var(--panel));display:grid;gap:3px;border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}.step .prz .ic{font-size:26px;line-height:1}
.step{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);display:grid;gap:8px;align-content:start;position:relative;min-width:0}
.step .gem{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font:700 15px var(--f-d);background:linear-gradient(135deg,var(--c2),var(--c))}
.step.cur{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.step.done{opacity:.85}.step.locked{opacity:.6}
.step ul{margin:0;padding-left:16px;font-size:12px;color:var(--mute);display:grid;gap:3px}
.step .st{position:absolute;top:12px;right:12px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bd{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;display:grid;gap:4px;background:var(--panel)}
.bd .ic{width:48px;height:48px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font:700 16px var(--f-d);background:linear-gradient(135deg,var(--gold),#f0c75e);color:#3a2a05}
.bd.off .ic{background:var(--line);color:var(--mute)}.bd.off{opacity:.65}
.goal{display:grid;gap:5px;padding:10px 0;border-bottom:1px solid var(--line)}.goal:last-child{border:0}
.goal .meter{height:8px}.goal .meter i{background:linear-gradient(90deg,var(--brand),var(--gold))}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-bottom:10px}
.pd{text-align:center;display:grid;gap:4px}.pd .av{width:52px;height:52px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font:700 18px var(--f-d);color:#fff}
.pd .pbar{border-radius:10px 10px 0 0;color:#fff;font:700 22px var(--f-d);display:grid;place-items:center}
.pz{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto 1fr auto}
.pz .top-c{padding:18px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;font-size:30px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000))}
.pz .in{padding:12px 14px;display:grid;gap:3px}.pz .ft{padding:0 14px 14px}
@media (max-width:860px){.ladder{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.rk-hero{grid-template-columns:1fr}.ladder{grid-template-columns:1fr}}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) var(--p),var(--line) 0)}
.ring div{width:76px;height:76px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;font:700 20px var(--f-d);line-height:1}
.ring small{display:block;font:500 10px var(--f-b);color:var(--mute)}
.rw{display:grid;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.lb li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}.lb{list-style:none;margin:0;padding:0}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.sub button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--mute)}.sub button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ov{position:fixed;inset:0;background:var(--shade);z-index:50;display:grid;place-items:start center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 24px}
.dlg{background:var(--panel);border-radius:14px;width:min(860px,100%);border:1px solid var(--line);overflow:hidden}
.dlg .ph{border-radius:0;aspect-ratio:21/7;padding:14px}.dlg .in{padding:18px;display:grid;gap:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.kv div{background:var(--bg);border-radius:8px;padding:8px 10px}.kv b{display:block;font:600 15px var(--f-d)}.kv span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.ofgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.st{font-size:16px}
.lbl{font-size:12px;font-weight:600;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink);text-align:left}.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pick{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px}.pk{display:flex;flex-direction:row;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;font-weight:500;color:var(--ink);font-size:13px}.pk:hover{background:var(--soft)}
.confirm{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px;padding:12px 14px;border:2px solid var(--brand);border-radius:12px;background:var(--soft)}
.camp{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:860px){.ofgrid{grid-template-columns:minmax(0,1fr)}}
.gal{display:flex;gap:8px;align-items:center;padding:10px 18px 0;flex-wrap:wrap}.gth{width:84px;height:60px;border-radius:8px;border:2px solid transparent;background-size:cover;background-position:center;cursor:pointer;padding:0}.gth[aria-pressed=true]{border-color:var(--gold)}
.tzed{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.lote{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.lote figure{margin:0;display:grid;gap:4px}.lote img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.pw{display:flex;gap:6px}.pw input{flex:1;min-width:0}
.ofbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--gold);background:var(--gold-soft);border-radius:12px;padding:10px 14px}

canvas{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block}
.mt{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
.chk{display:flex;align-items:center;gap:8px;flex-direction:row;font-weight:500;color:var(--ink)}
.demo{font:500 11px var(--f-m);background:rgba(240,199,94,.18);color:#f0c75e;padding:3px 8px;border-radius:6px;letter-spacing:.04em}

function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function wrap(x,t,a,b,mw,lh){const ws=String(t).split(" ");let l="";for(const w of ws){const n=l?l+" "+w:w;if(x.measureText(n).width>mw&&l){x.fillText(l,a,b);b+=lh;l=w}else l=n}x.fillText(l,a,b);return b}

const FBV="v21.0";
function fbCargar(){if(window.FB&&UI.fb.sdk)return Promise.resolve(window.FB);if(UI.fb.cargando)return UI.fb.cargando;
 UI.fb.cargando=new Promise((res,rej)=>{window.fbAsyncInit=()=>{try{FB.init({appId:S.cfg.fb_app_id,cookie:false,xfbml:false,version:FBV});UI.fb.sdk=true;res(window.FB)}catch(e){rej(e)}};
  const s=document.createElement("script");s.src="https://connect.facebook.net/es_LA/sdk.js";s.async=true;s.crossOrigin="anonymous";
  s.onerror=()=>{UI.fb.cargando=null;rej(new Error("No se pudo cargar Facebook. Revisa tu internet o desactiva el bloqueador de anuncios."))};document.head.appendChild(s)});
 return UI.fb.cargando}
const fbApi=(path,method,params)=>new Promise((res,rej)=>{try{FB.api(path,method,params||{},r=>{if(!r||r.error)rej(new Error(fbErr(r&&r.error)));else res(r)})}catch(e){rej(e)}});
function fbErr(e){if(!e)return "Facebook no respondió";const m=String(e.message||"");
 if(e.code===190)return "La conexión con Facebook venció. Toca «Conectar con Facebook» otra vez.";
 if(e.code===10||e.code===200||/permission/i.test(m))return "Falta un permiso de Facebook. Vuelve a conectar y acepta todos los permisos para tu página.";
 if(e.code===9004||/media/i.test(m)&&/url/i.test(m))return "Facebook no pudo leer una foto. Revisa que la página pública esté abierta.";
 if(e.code===368||e.code===4||e.code===32||e.code===613)return "Facebook pidió una pausa por publicar muy seguido. Espera unos minutos y sigue con las que faltan.";
 return m||"Error de Facebook"}

async function fbPagina(pg,p,u,fotos){const msg=fbTxt(p,u);

 const ids=[];for(const f of fotos){const r=await fbApi(`/${pg.id}/photos`,"post",{url:f,published:false,access_token:pg.tok});ids.push(r.id)}
 const prm={message:msg,access_token:pg.tok};ids.forEach((id,i)=>prm[`attached_media[${i}]`]=JSON.stringify({media_fbid:id}));
 const r=await fbApi(`/${pg.id}/feed`,"post",prm);return "https://www.facebook.com/"+r.id}
async function igListo(id,tok){for(let i=0;i<25;i++){const r=await fbApi(`/${id}`,"get",{fields:"status_code",access_token:tok});
  if(r.status_code==="FINISHED")return;if(r.status_code==="ERROR")throw new Error("Instagram no aceptó una foto (muy alta o en formato raro).");await esperar(1500)}

 else{const ch=[];for(const f of fotos)ch.push((await fbApi(`/${ig}/media`,"post",{image_url:f,is_carousel_item:true,access_token:tok})).id);

 await igListo(cid,tok);const m=await fbApi(`/${ig}/media_publish`,"post",{creation_id:cid,access_token:tok});

async function reducirFoto(file){const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
 c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",.85))}
async function subirFotos(cod,files,reemplaza){const fs=[...files].filter(f=>/^image\//.test(f.type));if(!fs.length)return;UI.inv.busy=true;
 try{const b=await rpc("boleto_subida",{p_codigo:cod});let n=0;
  for(const f of fs){UI.inv.msg=`Subiendo foto ${n+1} de ${fs.length}…`;render(1);
   const blob=await reducirFoto(f);const path=`${b}/${Date.now()}-${n}.jpg`;
   const {error}=await sb.storage.from("fotos").upload(path,blob,{contentType:"image/jpeg",upsert:false});if(error)throw new Error(error.message||"No se pudo subir la foto");
   const url=sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;const nid=await rpc("registrar_foto",{p_codigo:cod,p_ruta:path,p_url:url});if(reemplaza)await rpc("foto_reemplazar",{p_vieja:reemplaza,p_nueva:nid});n++}
  UI.inv.msg=reemplaza?"Foto cambiada.":`${n} ${n===1?"foto subida":"fotos subidas"}.`;await sbLoad();toast(UI.inv.msg)}
 catch(e){UI.inv.msg="No se pudo subir: "+(e.message||e);toast(UI.inv.msg)}
 UI.inv.busy=false;render(1)}

 else if(f==="od"){if(!can("precios"))return;const p=PR(t.dataset.v);if(p.of){p.ofHasta=plus(Math.max(0,+t.value||0));save();render(1)}}
 else if(t.id==="msModo"){UI.mas.modo=t.value;render(1)}else if(t.id==="msTipo"){UI.mas.tipo=t.value;render(1)}else if(t.id==="msProv"){UI.mas.prov=t.value;render(1)}else if(t.id==="msSolo"){UI.mas.solo=t.value;render(1)}
 else if(f==="hot"){if(!can("adm"))return;PR(t.dataset.v).hot=t.checked;save();toast(t.checked?"Destacada en la hot list":"Ya no está destacada")}
 else if(f==="perm"){const [r,k]=t.dataset.v.split("|");S.perm[r][k]=t.checked;save();render(1)}
});
try{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(UI.me&&UI.tab==="mat")drawCv()})}catch(e){}
{const ss=sbOn()&&sesLeer();if(ss){CRED.lic=ss.lic;CRED.pin=ss.tok;UI.cargando=true}}
if(sbOn()){sbLoad().then(ok=>{UI.cargando=false;if(!ok&&CRED.lic){CRED.lic=CRED.pin=null;sesBorrar();UI.me=null;UI.err="Tu sesión terminó. Vuelve a entrar.";return sbLoad()}}).then(()=>{UI.cargando=false;render()})}
else{try{const id=localStorage.getItem(SESKEY+"-local");const u=id&&S.users.find(x=>x.id===id);if(u&&u.st==="Activo"&&!u.cambiar)UI.me=u.id}catch(e){}}
render();
